---
layout: compress
---
<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en-US' }}">

  {% include head.html %}

  <body class="site">

    {% if site.google_tag_manager %}
      <!-- Google Tag Manager (noscript) -->
      <noscript>
        <iframe src="https://www.googletagmanager.com/ns.html?id={{ site.google_tag_manager }}"
                height="0" width="0" style="display:none;visibility:hidden"></iframe>
      </noscript>
      <!-- End Google Tag Manager (noscript) -->
    {% endif %}

    {% include header.html %}

    <!-- Hero: solid color background -->
    <div class="hero" style="background-color:#0f172a;">
      <div class="hero__wrap">
        <h1 class="hero__title">{{ site.title | escape }}</h1>
        {% if site.tagline %}
          <p class="hero__meta">{{ site.tagline }}</p>
        {% endif %}
      </div>
    </div>

    <!-- ✅ Only render page content (no post list/cards) -->
    <main class="site__content" role="main">
      <section class="container content" id="home-profile">
        {{ content }}
      </section>
    </main>

    {% include footer.html %}

  </body>
</html>
