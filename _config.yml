# SITE CONFIGURATION
title: donghoon11.github.io
author: Donghoon Oh
description: > 
  AI · Robotics · Design notes by Donghoon Oh.

# ✅ 사용자 페이지이므로 빈 문자열("")
baseurl: "" 
# ✅ 본인 사이트 URL
url: "https://donghoon11.github.io"

# SEO PLUGIN
social:
  name: Donghoon Oh
  links:
    - https://github.com/donghoon11
    # 필요 없으면 아래는 지우거나 주석 처리
    # - https://www.linkedin.com/in/your-id
    # - https://twitter.com/your-id

# THEME SETTINGS
navigation:
  - {name: 'Home', link: '/'}
  - {name: 'About', link: '/about'}
  - {name: 'Contact', link: '/contact'}

tagline: >
  Modern Jekyll theme focused on speed performance & SEO best practices

hero_img: posts/sleek_lg.jpg

email: your-email@domain.com

# 필요 없으면 주석 처리
# twitter_username: your_twitter
github_username:  donghoon11
# instagram_username: your_instagram

# 댓글을 쓸 거면 본인 단축명으로 교체, 아니면 통째로 주석
# disqus:
#   shortname: your-disqus-shortname

# google_tag_manager: GTM-XXXXXXX

service_worker: true

# BUILD SETTINGS
markdown: kramdown
kramdown:
  input: GFM               # ✅ GFM 파서 사용(필수)
highlighter: rouge
# theme: jekyll-sleek

exclude:
  - README.md
  - node_modules
  - script
  - package.json
  - package-lock.json
  - Gemfile
  - Gemfile.lock
  - vendor
  - npm-debug.log
  - gulpfile.js
  - sleek.jpg

include: ['_pages']
permalink: /:title/

compress_html:
  clippings: all

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
